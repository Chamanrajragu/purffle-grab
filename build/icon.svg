<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0d4ff"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Download arrow -->
  <g filter="url(#shadow)">
    <path d="M256 100 L256 320" stroke="url(#arrow)" stroke-width="48" stroke-linecap="round"/>
    <path d="M160 240 L256 340 L352 240" stroke="url(#arrow)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Base tray -->
  <path d="M128 370 L128 400 Q128 420 148 420 L364 420 Q384 420 384 400 L384 370" stroke="url(#arrow)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Music note sparkle -->
  <circle cx="390" cy="130" r="12" fill="#22d3ee" opacity="0.9"/>
  <circle cx="410" cy="160" r="8" fill="#22d3ee" opacity="0.6"/>
  <circle cx="120" cy="150" r="10" fill="#fbbf24" opacity="0.8"/>
</svg>
