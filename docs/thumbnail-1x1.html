<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PurffleGrab — 1:1 social</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow:hidden;background:#0b0a12;}
  body{width:1080px;height:1080px;}

  .stage{
    position:relative;width:1080px;height:1080px;overflow:hidden;
    background:#0b0a12;
    font-family:'Segoe UI Variable Display','Segoe UI',Inter,system-ui,sans-serif;
    color:#fff;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 76px;
  }

  .glow{position:absolute;inset:0;z-index:0;}
  .glow::before{
    content:"";position:absolute;
    left:-220px;top:-300px;width:1120px;height:1120px;
    background:radial-gradient(ellipse at 50% 50%, rgba(139,92,246,.42), rgba(139,92,246,0) 62%);
  }
  .glow::after{
    content:"";position:absolute;
    right:-260px;bottom:-320px;width:1100px;height:1100px;
    background:radial-gradient(ellipse at 50% 50%, rgba(236,72,153,.28), rgba(236,72,153,0) 60%);
  }
  .vignette{
    position:absolute;inset:0;z-index:1;
    background:radial-gradient(ellipse at 36% 38%, rgba(0,0,0,0) 30%, rgba(0,0,0,.56) 100%);
  }
  .edge{position:absolute;inset:0;z-index:9;border:2px solid #2a2233;pointer-events:none;}

  .content{position:relative;z-index:5;}

  /* --- identity lockup + open-source pill --- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:26px;}
  .brand{display:flex;align-items:center;gap:24px;}
  .iconwrap{position:relative;width:116px;height:116px;flex:none;}
  .iconwrap::before{
    content:"";position:absolute;inset:-64px;border-radius:50%;
    background:radial-gradient(circle at 44% 38%, rgba(172,116,255,.58), rgba(236,72,153,.26) 46%, transparent 72%);
    filter:blur(26px);
  }
  .icon{
    position:relative;width:116px;height:116px;border-radius:31px;
    background:linear-gradient(140deg,#a370fc 0%,#8b5cf6 32%,#ec4899 100%);
    display:flex;align-items:center;justify-content:center;
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,.18),
      0 20px 46px rgba(236,72,153,.42),
      0 10px 24px rgba(139,92,246,.44);
  }
  .icon svg{width:68px;height:68px;fill:#fff;display:block;
            filter:drop-shadow(0 3px 8px rgba(72,16,86,.34));}
  .wordmark{font-size:60px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:#fff;
            text-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap;}

  .pill{
    display:inline-flex;align-items:center;gap:12px;flex:none;
    padding:14px 28px 15px 22px;border-radius:999px;
    background:linear-gradient(90deg,#8b5cf6,#ec4899);
    box-shadow:0 12px 32px rgba(236,72,153,.42), inset 0 2px 0 rgba(255,255,255,.22);
    font-size:29px;font-weight:800;letter-spacing:2px;line-height:1;
    text-transform:uppercase;color:#fff;white-space:nowrap;
  }
  .pill svg{width:27px;height:27px;fill:#fff;flex:none;}

  /* --- headline: same spine, same ladder --- */
  .l1{
    margin:66px 0 0 -13px;
    font-size:292px;font-weight:800;letter-spacing:-12px;line-height:.84;color:#fff;
    text-shadow:0 18px 64px rgba(0,0,0,.6);
  }
  .l2{
    margin-top:26px;
    font-size:96px;font-weight:800;letter-spacing:-.6px;line-height:1;
    background:linear-gradient(90deg,#a78bfa 0%,#d489f4 46%,#f472b6 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    width:max-content;padding-right:10px;white-space:nowrap;
  }
  .l3{
    margin-top:22px;
    font-size:92px;font-weight:800;letter-spacing:1.6px;line-height:1;color:#fff;
    text-shadow:0 14px 52px rgba(0,0,0,.55);
  }

  .rule{
    margin-top:52px;width:520px;height:7px;border-radius:4px;
    background:linear-gradient(90deg,#8b5cf6,#ec4899);
    box-shadow:0 0 26px rgba(236,72,153,.55);
  }

  .formats{margin-top:52px;display:flex;align-items:stretch;gap:18px;}
  .fp{
    display:flex;align-items:center;justify-content:center;
    height:82px;padding:0 30px;border-radius:24px;
    font-size:50px;font-weight:800;letter-spacing:1.2px;line-height:1;
    color:#fff;white-space:nowrap;
    background:#322740;border:2px solid rgba(196,181,253,.50);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.14), 0 14px 30px rgba(0,0,0,.45);
  }
  .fp.hero{
    background:linear-gradient(100deg,#8b5cf6 0%,#ec4899 100%);
    border:0;padding:0 34px;
    box-shadow:0 18px 40px rgba(236,72,153,.44), inset 0 2px 0 rgba(255,255,255,.28);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="top">
        <div class="brand">
          <div class="iconwrap">
            <div class="icon">
              <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <rect x="20.9" y="6" width="6.2" height="19.5" rx="3.1"/>
                <path d="M11.6 22.9h24.8c1.5 0 2.3 1.8 1.2 2.9L25.7 37.6a2.4 2.4 0 0 1-3.4 0L10.4 25.8c-1.1-1.1-.3-2.9 1.2-2.9z"/>
                <rect x="10.6" y="39.6" width="26.8" height="6" rx="3"/>
              </svg>
            </div>
          </div>
          <div class="wordmark">PurffleGrab</div>
        </div>
        <div class="pill">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="20.9" y="6" width="6.2" height="19.5" rx="3.1"/>
            <path d="M11.6 22.9h24.8c1.5 0 2.3 1.8 1.2 2.9L25.7 37.6a2.4 2.4 0 0 1-3.4 0L10.4 25.8c-1.1-1.1-.3-2.9 1.2-2.9z"/>
            <rect x="10.6" y="39.6" width="26.8" height="6" rx="3"/>
          </svg>
          Open source
        </div>
      </div>

      <div class="l1">FREE</div>
      <div class="l2">SPOTIFY&nbsp;+&nbsp;YOUTUBE</div>
      <div class="l3">DOWNLOADER</div>

      <div class="rule"></div>

      <div class="formats">
        <div class="fp">MP3</div>
        <div class="fp">MP4</div>
        <div class="fp">FLAC</div>
        <div class="fp hero">UP TO 4K</div>
      </div>
    </div>

    <div class="edge"></div>
  </div>
</body>
</html>
