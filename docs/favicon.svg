<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3d"/>
      <stop offset="0.55" stop-color="#171b24"/>
      <stop offset="1" stop-color="#0e1016"/>
    </linearGradient>
    <linearGradient id="silver" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e3e7ee"/>
      <stop offset="1" stop-color="#c2c9d6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- monogram cut, authored on a 512 grid then scaled/translated into the badge -->
    <mask id="mono">
      <rect width="1024" height="1024" fill="black"/>
      <!-- glyph authored on a 512 grid (center ~260,256); scaled into the badge -->
      <g transform="translate(512,516) scale(1.46) translate(-272,-256)">
        <rect x="110" y="54" width="88" height="404" rx="32" fill="white"/>
        <rect x="110" y="54" width="300" height="84" rx="32" fill="white"/>
        <rect x="322" y="54" width="88" height="312" rx="32" fill="white"/>
        <rect x="110" y="282" width="300" height="84" rx="32" fill="white"/>
        <rect x="110" y="374" width="228" height="84" rx="32" fill="white"/>
        <rect x="202" y="130" width="122" height="160" rx="38" fill="black"/>
        <rect x="368" y="150" width="72" height="30" rx="15" transform="rotate(-34 404 165)" fill="black"/>
      </g>
    </mask>
  </defs>
  <rect x="52" y="52" width="920" height="920" rx="212" fill="url(#badge)"/>
  <rect x="52" y="52" width="920" height="920" rx="212" fill="url(#sheen)"/>
  <rect x="52.5" y="52.5" width="919" height="919" rx="211.5" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  <rect width="1024" height="1024" fill="url(#silver)" mask="url(#mono)"/>
</svg>
