name: CI — Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Build on all 3 platforms ──────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            script: dist
          - os: macos-latest
            platform: mac
            script: dist:mac
          - os: ubuntu-latest
            platform: linux
            script: dist:linux

    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Download platform-specific yt-dlp ──
      - name: Download yt-dlp (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          mkdir -p bin
          curl -L -o bin/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe

      - name: Download yt-dlp (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          mkdir -p bin
          curl -L -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos
          chmod +x bin/yt-dlp

      - name: Download yt-dlp (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mkdir -p bin
          curl -L -o bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux
          chmod +x bin/yt-dlp

      # ── Download platform-specific ffmpeg ──
      - name: Download ffmpeg (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -o ffmpeg.zip -d ffmpeg-tmp
          cp ffmpeg-tmp/*/bin/ffmpeg.exe bin/ffmpeg.exe
          cp ffmpeg-tmp/*/bin/ffprobe.exe bin/ffprobe.exe
          rm -rf ffmpeg.zip ffmpeg-tmp

      - name: Download ffmpeg (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          brew install ffmpeg
          cp "$(which ffmpeg)" bin/ffmpeg
          cp "$(which ffprobe)" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe

      - name: Download ffmpeg (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          curl -L -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg.tar.xz
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg bin/ffmpeg
          cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl

      - name: List bin contents
        run: ls -la bin/
        shell: bash

      # Build — disable electron-builder's built-in publish (we use softprops)
      - name: Build
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload build artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  # ── Attach artifacts to GitHub Release (on tag push only) ─────
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List artifacts
        run: find dist -type f | sort

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.AppImage
            dist/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Deploy GitHub Pages (SEO landing page) ────────────────────
  pages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
